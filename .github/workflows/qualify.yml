name: Qualify

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  COMFY_NO_TELEMETRY: "1"
  COMFY_NO_UPDATE_CHECK: "1"

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q tests/unit
      - run: node --test tests/frontend/ratio_preview.test.mjs tests/frontend/crop_editor.test.mjs

  package:
    name: Package (Linux, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: comfy node validate
      - run: comfy node pack
      - run: python -m pytest -q tests/package --archive node.zip

  cpu:
    name: Packed CPU (${{ matrix.os }}, ${{ matrix.comfy_ref }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        comfy_ref: [v0.28.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: comfy node pack
      - run: >-
          python -m pytest -q tests/integration
          --comfy-ref ${{ matrix.comfy_ref }}
          --archive node.zip
          --device cpu

  cuda:
    name: Packed CUDA (v0.28.0)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/unit
      - run: comfy node pack
      - run: >-
          python -m pytest -q tests/integration
          --comfy-ref v0.28.0
          --archive node.zip
          --device cuda
