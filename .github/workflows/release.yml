name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml

  tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Match exact tag to package version
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None or tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish approved Registry version
    needs: [qualify, tag]
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install reviewed release tools
        run: python -m pip install -e . pytest "comfy-cli==1.12.0"
      - run: comfy node validate
      - run: comfy node pack
      - run: python -m pytest -q tests/package --archive node.zip
      - run: git diff --exit-code
      - name: Publish immutable version
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: >-
          comfy node publish
          --token "$REGISTRY_ACCESS_TOKEN"
          --changelog "Add LFGG Resize Image by Long Side."
      - name: Verify public Registry page
        run: >-
          python -c
          "from urllib.request import urlopen;
          response=urlopen('https://registry.comfy.org/lfelipegg/lfgg-nodes', timeout=15);
          assert response.status == 200"
      - name: Download exact published archive
        run: >-
          python tests/integration/download_registry_archive.py
          lfgg-nodes
          ${{ needs.tag.outputs.version }}
          registry-node.zip
      - run: python -m pytest -q tests/package --archive registry-node.zip
      - name: Create fresh Registry workspace
        env:
          REGISTRY_WORKSPACE: ${{ runner.temp }}/lfgg-registry-workspace
          REGISTRY_TOOLS: ${{ runner.temp }}/lfgg-registry-tools
        run: |
          python -m venv "$REGISTRY_TOOLS"
          "$REGISTRY_TOOLS/bin/python" -m pip install "comfy-cli==1.12.0"
          echo "REGISTRY_WORKSPACE=$REGISTRY_WORKSPACE" >> "$GITHUB_ENV"
          echo "REGISTRY_TOOLS=$REGISTRY_TOOLS" >> "$GITHUB_ENV"
      - name: Install exact supported ComfyUI
        run: >-
          "$REGISTRY_TOOLS/bin/comfy"
          --workspace="$REGISTRY_WORKSPACE/ComfyUI"
          --skip-prompt
          install --version 0.28.0 --cpu
      - name: Install exact published Registry version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: >-
          "$REGISTRY_TOOLS/bin/comfy"
          --workspace="$REGISTRY_WORKSPACE/ComfyUI"
          --skip-prompt
          node install "lfgg-nodes@${VERSION}" --exit-on-fail
      - name: Exercise fresh Registry installation
        run: >-
          python -m pytest -q tests/integration
          --installed-comfyui "$REGISTRY_WORKSPACE/ComfyUI"
          --device cpu
